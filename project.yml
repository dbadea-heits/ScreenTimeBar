name: ScreenTimeBar
options:
  bundleIdPrefix: com.local
  deploymentTarget: { macOS: "14.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: ScreenTimeBar
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  ScreenTimeBar:
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.ScreenTimeBar
    info:
      path: Info-generated.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Screen Time
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        CFBundleURLTypes:
          - CFBundleURLName: com.local.ScreenTimeBar
            CFBundleURLSchemes: [screentimebar]
